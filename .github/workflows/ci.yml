name: Integration Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Create test env file
        run: |
          cat > .test.env <<EOF
          HOST=localhost
          PORT=3001
          PGHOST=${{ secrets.RDS_HOST }}
          PGUSER=${{ secrets.RDS_USER }}
          PGDATABASE=${{ secrets.RDS_DATABASE }}
          PGPASSWORD=${{ secrets.RDS_PASSWORD }}
          PGPORT=${{ secrets.RDS_PORT }}
          ACCESS_TOKEN_KEY=test-access-token-key
          REFRESH_TOKEN_KEY=test-refresh-token-key
          ACCESS_TOKEN_AGE=3000
          EOF

      - name: Run migration
        run: npm run migrate:test

      - name: Run test
        run: npm test
        env:
          NODE_ENV: test